name: Documentation Health

on:
  pull_request:
    paths:
      - "docs/plans/**"
      - "docs/DEVELOPMENT.md"
      - "scripts/rumil_markdown_link_check.py"
      - "tests/test_rumil_markdown_link_check.py"
      - ".github/workflows/documentation-health.yml"
  push:
    paths:
      - "docs/plans/**"
      - "docs/DEVELOPMENT.md"
      - "scripts/rumil_markdown_link_check.py"
      - "tests/test_rumil_markdown_link_check.py"
      - ".github/workflows/documentation-health.yml"

permissions:
  contents: read

jobs:
  active-plan-claims:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Run Rúmil Markdown checker tests
        run: python -m unittest tests.test_rumil_markdown_link_check -v

      - name: Validate active-plan links and completion language
        run: |
          python scripts/rumil_markdown_link_check.py \
            --root docs/plans \
            --out /tmp/arda-doc-health.md \
            --check-completion-language
