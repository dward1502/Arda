[workspace]
resolver = "2"
members = [
    "crates/engine",
    "crates/spine/runtime/manwe",
    "crates/spine/governance/arda-core",
    "crates/spine/governance/arda-council",
    "crates/spine/governance/arda-governance",
    "crates/spine/interface/arda-orome",
    "crates/spine/observability/arda-aule",
    "apps/arda-launcher/src-tauri",
    "crates/spine/executors/arda-varda",
    "crates/spine/executors/arda-service-registry",
    "crates/spine/runtime/arda-economics",
    "crates/spine/runtime/arda-mandos",
    "crates/spine/memory/arda-vaire",
]

[package]
name = "arda"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "arda"
path = "src/main.rs"

[dependencies]
arda-engine = { path = "crates/engine" }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["dward"]

[workspace.dependencies]
# --- Arda originals ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.30"
tempfile = "3"
# --- merged from Annunimas ---
async-trait = "0.1"
serde_yaml = "0.9"
# Arda crates (formerly annunimas-*) referenced via `workspace = true`
arda-core = { path = "crates/spine/governance/arda-core" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
clap = { version = "4", features = ["derive"] }
futures = "0.3"
rand = "0.8"
yaml-rust = "0.4"
# --- manwe gateway ---
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serenity = { version = "0.12", default-features = false, features = ["builder", "client", "gateway", "http", "model", "utils", "rustls_backend"] }
