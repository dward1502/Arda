[workspace]
resolver = "2"
members = [
    # Arda-native
    "crates/engine",
    "crates/manwe",
    # Vendored Annunimas crates (reorganized under crates/spine/<category>/)
    "crates/spine/interface/annunimas-apollo",
    "crates/spine/executors/annunimas-athena",
    "crates/spine/executors/annunimas-ceo",
    "crates/spine/runtime/annunimas-charon",
    "crates/spine/memory/annunimas-chronos",
    "crates/spine/interface/annunimas-cli",
    "crates/spine/interface/annunimas-comm",
    "crates/spine/governance/annunimas-core",
    "crates/spine/governance/annunimas-council",
    "crates/spine/interface/annunimas-fleet",
    "crates/spine/tooling/annunimas-forge-mind",
    "crates/spine/governance/annunimas-governance",
    "crates/spine/runtime/annunimas-hades",
    "crates/spine/interface/annunimas-hermes",
    "crates/spine/executors/annunimas-human",
    "crates/spine/interface/annunimas-mcp",
    "crates/spine/memory/annunimas-mnemosyne",
    "crates/spine/interface/annunimas-onboarding",
    "crates/spine/runtime/annunimas-oracle",
    "crates/spine/runtime/annunimas-plutus",
    "crates/spine/observability/annunimas-prometheus",
    "crates/spine/executors/annunimas-service-registry",
    "crates/spine/observability/annunimas-signal-grid",
    "crates/spine/executors/annunimas-systemd",
    "crates/spine/tooling/annunimas-tool-harness",
    "crates/spine/tooling/annunimas-warden",
]

[package]
name = "arda"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "arda"
path = "src/main.rs"

[dependencies]
arda-engine = { path = "crates/engine" }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["dward"]

[workspace.dependencies]
# --- Arda originals ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.30"
tempfile = "3"
# --- merged from Annunimas ---
async-trait = "0.1"
serde_yaml = "0.9"
# Annunimas crates referenced via `workspace = true` inside the vendored crates
annunimas-core = { path = "crates/spine/governance/annunimas-core" }
annunimas-governance = { path = "crates/spine/governance/annunimas-governance" }
annunimas-mnemosyne = { path = "crates/spine/memory/annunimas-mnemosyne" }
annunimas-oracle = { path = "crates/spine/runtime/annunimas-oracle" }
annunimas-plutus = { path = "crates/spine/runtime/annunimas-plutus" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
clap = { version = "4", features = ["derive"] }
futures = "0.3"
rand = "0.8"
yaml-rust = "0.4"
# --- manwe gateway ---
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serenity = { version = "0.12", default-features = false, features = ["builder", "client", "gateway", "http", "model", "utils", "rustls_backend"] }
