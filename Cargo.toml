[workspace]
resolver = "2"
members = [
    "crates/arda-core",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.30"
tempfile = "3"
