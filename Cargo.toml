[workspace]
resolver = "2"
members = [
    # Arda-native
    "crates/engine",
    "crates/spine/runtime/manwe",
    "crates/spine/governance/arda-core",
    "crates/spine/governance/arda-council",
    "crates/spine/governance/arda-tool-harness",
    "crates/spine/interface/arda-onboarding",
    "crates/spine/executors/arda-service-registry",
    "crates/spine/runtime/arda-systemd",
]

[package]
name = "arda"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "arda"
path = "src/main.rs"

[dependencies]
arda-engine = { path = "crates/engine" }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["dward"]

[workspace.dependencies]
# --- Arda originals ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.30"
tempfile = "3"
# --- merged from Annunimas ---
async-trait = "0.1"
serde_yaml = "0.9"
# Annunimas crates referenced via `workspace = true` inside the vendored crates
annunimas-charon = { path = "crates/old-annunimas/annunimas-charon" }
arda-core = { path = "crates/spine/governance/arda-core" }
annunimas-governance = { path = "crates/old-annunimas/annunimas-governance" }
annunimas-mnemosyne = { path = "crates/old-annunimas/annunimas-mnemosyne" }
annunimas-oracle = { path = "crates/old-annunimas/annunimas-oracle" }
annunimas-plutus = { path = "crates/old-annunimas/annunimas-plutus" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
clap = { version = "4", features = ["derive"] }
futures = "0.3"
rand = "0.8"
yaml-rust = "0.4"
# --- manwe gateway ---
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serenity = { version = "0.12", default-features = false, features = ["builder", "client", "gateway", "http", "model", "utils", "rustls_backend"] }
