# Empty workspace table: keeps this Tauri crate independent of the Arda
# root workspace so it builds on its own (e.g. `cargo build` here, or via
# `pnpm tauri dev/build`). Without this, cargo tries to pull it into the
# root workspace and fails.
[workspace]

[package]
name = "arda-hud"
version = "0.1.0"
description = "Arda operator HUD — Tauri app"
authors = ["dward"]
edition = "2021"

[lib]
# The `_lib` suffix is necessary to make the lib name unique and avoid
# conflicting with the bin name (Windows cargo quirk, see tauri template).
name = "arda_hud_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
