[workspace]

[patch.crates-io]
glib = { path = "../../../vendor/glib-0.18.5" }

[package]
name = "arda_mirromere"
version = "0.1.0"
edition = "2021"

[lib]
name = "arda_mirromere_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
gio = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock", "serde"] }
arda-mirromere = { path = "../../../crates/spine/interface/arda-mirromere" }
arda-outpost-protocol = { path = "../../../outposts/arda-outpost-protocol" }
arda-launcher = { path = "../../arda-launcher/src-tauri", package = "arda-launcher" }
