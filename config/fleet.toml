# sigil: SCROLL
[fleet]
enabled = true
status_view_mode = "active_only" # active_only | active_plus_recent | full
stale_offline_threshold_days = 14
include_recent_offline_in_status = false

[exports]
prometheus_dir = "data/prometheus"
ceo_layer_prometheus_dir = "core/metrics/by_crate/prometheus"

[events]
warden_event_queue_path = "data/warden/informant_queue.jsonl"

[scheduler]
fleet_scan_interval_minutes = 15

[routing]
local_runtime = "llamacpp" # mesh-llm | llamacpp | hybrid
local_execution_provider_id = "edge_core"
local_fallback_provider_ids = ["edge_guardhouse", "local_fallback"]

