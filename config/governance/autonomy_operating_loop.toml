schema_version = "arda.autonomy_operating_loop.v1"
project_id = "annunimas"
status = "active_draft"
owner = "prometheus_hades_chronos"

[canonical]
spine = "autonomous_operating_loop"
engine = "ceo_autopilot"
engine_owner = "prometheus"
config_contract = "config/autonomy_operating_loop.toml"
contract_doc = "docs/contracts/autonomous-operating-loop-contract.md"
rule = "the loop is the portable policy/config spine; ceo-autopilot remains the orchestration and execution engine"

[loop]
mode = "continuous_preflight"
cadence = "every_10_minutes"
default_mutation_policy = "no_mutation_without_policy_gate"
confirm_after_execute = true
stages = [
  "info",
  "ingest",
  "digest",
  "assess",
  "deliberate",
  "plan",
  "task",
  "execute",
  "audit",
  "review",
  "replan",
  "confirm",
]

[portability]
root = "."
path_policy = "repo_relative_only"
forbid_absolute_paths = true
forbid_project_specific_logic = true
project_overrides_allowed = [
  "project_id",
  "managed_roots",
  "source_roots",
  "council_agents",
  "external_sources",
]

[maintenance]
planner = "prometheus"
scheduler = "chronos"
lifecycle_owner = "hades"
knowledge_owner = "athena"
review_owner = "oracle"
guard_owner = "warden"
preflight_output_json = "data/prometheus/autonomy_operating_loop_preflight.json"
preflight_output_markdown = "data/prometheus/autonomy_operating_loop_preflight.md"
cleanup_approval_packets_json = "data/hades/autonomy_cleanup_approval_packets.json"
cleanup_approval_packets_markdown = "data/hades/autonomy_cleanup_approval_packets.md"
external_source_lane_ledger_jsonl = "data/athena/external_source_lane_ledger.jsonl"
external_source_lane_ledger_markdown = "data/athena/external_source_lane_ledger.md"

[promotion]
knowledge_triage_default = "evidence_only"
task_queue_mutation_requires_contract = true
task_queue_mutation_requires_receipt = true
task_queue_mutation_requires_source_provenance = true
triage_may_propose_packets = true
triage_may_execute = false
allowed_task_promotion_contracts = [
  "flywheel_plan_packet",
  "prometheus_safe_local_task_promotion",
  "arda.arandur.queue_operation.v1",
]

[l3]
status = "contract_defined_enforcement_pending"
first_bounded_mutation_class = "l3_local_doc_fixture_patch"
contract = "docs/contracts/l3-bounded-mutation-class.md"
policy_mode_before_enforcement = "record_and_proceed"
policy_mode_after_l3c_p4_l3c_p6 = "block_on_fail"
action_classes = ["local_refactors", "documentation_indexing"]
excluded_action_classes = [
  "destructive_delete",
  "archive_or_retention",
  "generated_artifact_cleanup",
  "credential_rotation_or_disclosure",
  "funds_movement",
  "legal_commitment",
  "customer_commitment",
  "external_customer_commitment_without_prior_scope",
  "provider_reroute",
  "provider_reload",
  "service_restart",
  "service_disable",
  "fleet_reimage",
]
allowed_paths = [
  "tests/fixtures/l3/**",
  "data/prometheus/l3/**",
  "data/prometheus/l3_e2e_receipt.json",
  "core/state/l3_readiness_projection.json",
  "docs/operations/l3-readiness-onboarding.md",
  "docs/contracts/l3-bounded-mutation-class.md",
]
required_gates = [
  "latest_by_id_open_flywheel_packet",
  "risk_safe_local",
  "expected_files_subset_allowed_paths",
  "warden_path_action_pass",
  "oracle_packet_metadata_pass",
]
receipt_schema = "arda.l3.bounded_mutation_receipt.v1"
receipt_surface = "data/prometheus/l3_e2e_receipt.json"
rollback_policy = "local_deterministic_restore_or_compensating_append_only_record"

[[lanes]]
id = "cadence"
agent = "chronos"
role = "schedule cadence, freshness audits, and recurring checks"
engine_interface = "timer_or_chronos_audit_task"
default_policy = "read_only_or_local_receipt"

[[lanes]]
id = "intake"
agent = "athena"
role = "absorb local and approved external sources into canonical source ledgers"
engine_interface = "knowledge_triage"
default_policy = "ledger_before_task"

[[lanes]]
id = "routing"
agent = "charon"
role = "select model/provider routes for analysis, planning, and execution helpers"
engine_interface = "provider_route_decision"
default_policy = "no_route_switch_without_receipt_and_gate"

[[lanes]]
id = "validation"
agent = "oracle"
role = "validate claims, plan quality, and confirmation language"
engine_interface = "oracle_gate"
default_policy = "review_before_high_risk_promotion"

[[lanes]]
id = "economics"
agent = "plutus"
role = "track JouleWork and economic constraints"
engine_interface = "joulework_budget"
default_policy = "budget_receipt_before_delegation"

[[lanes]]
id = "planning"
agent = "prometheus"
role = "decompose objectives, maintain plan/task lifecycle, and drive ceo-autopilot"
engine_interface = "ceo_autopilot"
default_policy = "safe_local_first"

[[lanes]]
id = "council"
agent = "council"
role = "host agent discussion, questions, objections, synthesis, and governance-informed recommendations"
engine_interface = "agent_conversation_ledger"
default_policy = "deliberation_is_evidence_not_approval"

[[lanes]]
id = "execution"
agent = "apollo"
role = "execute approved work packets and local task actions"
engine_interface = "flywheel_or_apollo_dispatch"
default_policy = "bounded_execution_receipts_required"

[[lanes]]
id = "lifecycle"
agent = "hades"
role = "classify stale files, inspect generated code/docs/config, audit scope drift, plan cleanup, archive candidates, and cleanup receipts"
engine_interface = "lifecycle_audit"
default_policy = "audit_first_no_delete_or_archive_without_gate"

[[lanes]]
id = "introspection"
agent = "hades"
role = "continuously inspect repository changes, generated artifacts, plan/task alignment, stale references, and scope compliance"
engine_interface = "organization_audit_lifecycle_audit_repeated_audit"
default_policy = "evidence_only_until_approval_packet"

[[lanes]]
id = "safety"
agent = "warden"
role = "enforce action-class, permission, and safety gates"
engine_interface = "policy_guard"
default_policy = "block_or_review_unsafe_actions"

[[lanes]]
id = "confirmation"
agent = "hermes"
role = "publish receipts, operator updates, and remote confidence summaries"
engine_interface = "receipt_delivery"
default_policy = "receipt_backed_confirmation_only"

[[sovereign_crates]]
id = "governance"
crate = "annunimas-governance"
role = "policy primitives, action classes, readiness labels, triad and resonance context"
loop_stages = ["assess", "deliberate", "plan", "task", "audit", "review", "replan"]
consumes = ["task_intent", "plan_scope", "council_synthesis", "oracle_verdict", "hades_findings", "plutus_budget"]
produces = ["governance_classification", "readiness_label", "approval_requirements", "escalation_reason"]
gate = "classify_action_and_required_authority_before_task_or_execute"
status = "contract_required"

[[sovereign_crates]]
id = "oracle"
crate = "annunimas-oracle"
role = "validation engine for claims, evidence, plan quality, reviews, and confirmation language"
loop_stages = ["assess", "deliberate", "plan", "audit", "review", "confirm"]
consumes = ["source_digest", "plan", "task_packet", "council_questions", "hades_findings", "execution_receipts"]
produces = ["verdict", "validation_notes", "blocking_findings", "confirmation_review"]
gate = "validate_before_high_risk_promotion_and_before_claiming_done"
status = "active_prototype"

[[sovereign_crates]]
id = "plutus"
crate = "annunimas-plutus"
role = "JouleWork accounting, budget pressure, economic constraints, and cost receipts"
loop_stages = ["assess", "plan", "task", "execute", "audit", "review"]
consumes = ["objective", "task_estimate", "route_decision", "runtime_usage", "execution_receipts"]
produces = ["joulework_budget", "budget_receipt", "cost_pressure", "economic_review"]
gate = "budget_receipt_before_delegation_and_review_after_execution"
status = "contract_required"

[[sovereign_crates]]
id = "ceo"
role = "productized CEO/orchestration API surface; current runtime authority remains Prometheus ceo-autopilot"
loop_stages = ["plan", "task", "execute", "audit", "review", "replan", "confirm"]
consumes = ["objective", "governance_classification", "oracle_verdict", "plutus_budget", "council_synthesis"]
produces = ["delegation_plan", "task_promotion", "outcome_synthesis", "next_action"]
gate = "must_not_compete_with_prometheus_ceo_autopilot_until_promoted"
status = "prometheus_cea_autopilot_only"

[[sovereign_crates]]
id = "human"
crate = "annunimas-human"
role = "human knowledge interface, approval lane, vault bridge, and operator decision authority"
loop_stages = ["info", "ingest", "deliberate", "plan", "task", "review", "confirm"]
consumes = ["human_notes", "approval_requests", "knowledge_exports", "critical_decision_packets"]
produces = ["human_knowledge_records", "approval_decisions", "operator_context", "human_confirmation"]
gate = "human_required_action_classes_need_explicit_human_approval"
status = "contract_required"

[[sovereign_crates]]
id = "council"
crate = "annunimas-council"
role = "multi-agent deliberation, objections, synthesis, and escalation recommendation"
loop_stages = ["deliberate", "assess", "plan", "review", "replan"]
consumes = ["source_digest", "agent_questions", "hades_findings", "oracle_verdict", "governance_context"]
produces = ["council_conversation", "points_of_agreement", "points_of_tension", "synthesis_recommendation"]
gate = "evidence_for_governance_not_approval_by_itself"
status = "active_subordinate"

[lifecycle]
managed_roots = [
  "docs/plans",
  "docs/operations",
  "docs/contracts",
  "human/05-Projects/plans",
  "core/projects/Plans",
]
active_reference_roots = [
  "AGENTS.md",
  "README.md",
  "ANNUNIMAS_ROOT_PROTOCOL.md",
  "CODEMAP.md",
  "docs",
  "core",
  "human",
  "config",
  "scripts",
  "crates",
]
generated_roots = [
  "data",
  "audit",
  "core/metrics",
  "core/state",
]
archive_roots = [
  "archive",
  "archived_scripts",
  "human/archive",
  "docs/plans/archive",
]
archive_requires_approval = true
delete_requires_approval = true
remove_reference_when_referencing_doc_is_inactive = true
inactive_status_markers = [
  "status: archived",
  "status: superseded",
  "status: complete",
  "status: completed",
  "superseded by",
  "archive candidate",
]
active_status_markers = [
  "status: active",
  "status: active-draft",
  "status: live-ready",
  "status: in_progress",
  "status: current",
]

# ATHENA external-source gates are intentionally split by capability:
# receipts can be collected before policy-ready candidates exist, and task
# promotion stays disabled until PROMETHEUS records a separate promotion receipt.
[[external_sources]]
id = "web"
kind = "internet_search"
status = "gated"
promotion_policy = "ledger_before_task"
open_for_receipts = true
open_for_policy_ready_candidates = true
open_for_task_promotion = false
connector_gate = "fixture_only_safe_local; live_http_requires_warden_oracle_prometheus_gate"
required_next_step = "prometheus_safe_local_promotion_receipt_before_live_http_or_cron"

[[external_sources]]
id = "x_bookmarks"
kind = "social_bookmarks"
status = "gated"
promotion_policy = "canonical_source_ledger_before_task"
open_for_receipts = true
open_for_policy_ready_candidates = true
open_for_task_promotion = false
connector_gate = "receipt_import_available; exact_post_hydration_requires_approved_connector"
required_next_step = "canonicalize_imported_receipts_and_run_policy_readiness_before_task_promotion"

[[external_sources]]
id = "reddit"
kind = "public_forum"
status = "connector_needed"
promotion_policy = "canonical_source_ledger_before_task"
open_for_receipts = false
open_for_policy_ready_candidates = false
open_for_task_promotion = false
connector_gate = "inspect_mcp_candidate_read_only_anonymous_before_enabling"
required_next_step = "approve_read_only_connector_then_write_canonical_source_receipts"
connector_reference_url = "https://github.com/jordanburke/reddit-mcp-server"
connector_reference_type = "mcp_server_candidate"
connector_reference_note = "User-provided Reddit MCP candidate; inspect before enabling and keep source promotion behind canonical ATHENA receipts."

[[external_sources]]
id = "notebook_lm"
kind = "user_knowledge_export"
status = "connector_needed"
promotion_policy = "canonical_source_ledger_before_task"
open_for_receipts = false
open_for_policy_ready_candidates = false
open_for_task_promotion = false
connector_gate = "browser_account_cookie_state_requires_explicit_operator_approval; agent_synthesis_is_not_canonical_truth"
required_next_step = "resolve_mcp_auth_source_grounding_and_compare_claims_to_repo_receipts"
connector_reference_url = "https://github.com/PleasePrompto/notebooklm-mcp"
connector_reference_alternates = ["https://mcpservers.org/servers/roomi-fields/notebooklm-mcp"]
connector_reference_type = "mcp_server_candidate"
connector_reference_note = "User noted Notebook may already be connected with Hermes Agent; otherwise inspect these MCP candidates before enabling."

[[external_sources]]
id = "public_archives"
kind = "public_archive"
status = "connector_needed"
promotion_policy = "canonical_source_ledger_before_task"
open_for_receipts = false
open_for_policy_ready_candidates = false
open_for_task_promotion = false
connector_gate = "public_archive_seed_only; connector_policy_and_license_review_required"
required_next_step = "validate_seed_policy_boundaries_then_write_canonical_source_receipts"
connector_reference_url = "https://annas-archive.pk/blog/llms-txt.html"
connector_reference_type = "source_seed"
connector_reference_note = "User-provided Anna's Archive llms.txt public-archives seed for ATHENA receipt/deep/policy validation."

[council]
agents = [
  "arandur",
  "prometheus",
  "hades",
  "athena",
  "oracle",
  "warden",
  "chronos",
  "charon",
  "plutus",
  "apollo",
  "hermes",
]
decision_policy = "receipted_local_consensus_before_task_mutation"
human_augmentation = "supported_but_not_required_for_safe_local_preflight"
conversation_ledger = "data/council/agent_conversations.jsonl"
question_policy = "agents_ask_each_other_first_then_create_scout_request_if_information_is_missing"
critical_decision_policy = "human_approval_required_for_human_required_action_classes"
governance_policy_contract = "docs/contracts/autonomy-governance-action-classes.md"
conversation_channel = "council"
