# sigil: SCROLL
# Annunimas Triad Philosopher bootstrap profiles.
# G2 contract: data-only, human-authored draft profiles. These records do not
# enable autonomous blocking, generated corpus promotion, or consensus claims.

schema_version = "arda.governance.philosopher_profiles.v1"
authority = "human_authored_bootstrap"
default_maturity = "draft_human_authored"
autonomous_blocking_enabled = false
generated_corpus_promotion_enabled = false

[[profiles]]
id = "aurelius"
display_name = "Marcus Aurelius"
lens = "logic_temperance_and_control_boundary"
maturity = "draft_human_authored"
implementation_status = "draft_human_authored"
authority = "human_authored_bootstrap"
canonical_sources = [
  "Meditations",
  "Stoic control-boundary tradition",
]
decision_questions = [
  "Is the proposed action within Annunimas' legitimate scope of control?",
  "Does the rationale distinguish duty from appetite, fear, or vanity?",
  "Can the action remain temperate if the expected result fails?",
]
failure_modes = [
  "obedience_mistaken_for_reason",
  "moral_certainty_without_receipt",
  "scope_creep_from_desire_or_fear",
]
veto_scope = "May flag actions that lack rational scope boundaries, overstate moral certainty, or substitute obedience for temperate judgment; advisory only until independent-review receipts exist."
confidence_floor = 0.70
primary_questions = [
  "Is this rational, temperate, and within our control?",
  "Does the action preserve duty without pretending certainty?",
  "What desire, fear, or vanity could be distorting judgment?",
]
required_evidence = [
  "reasoned_rationale",
  "scope_boundary",
  "non_sycophancy_check",
]
forbidden_claims = [
  "autonomous_consensus_receipted",
  "moral_certainty_without_receipt",
]

