# Sigil: SCROLL (U+1F4DC); purpose: repository-visible governed configuration.

# Per-provider/model joule tariffs for the EstimatorMeter.
#
# Numbers are order-of-magnitude estimates derived from public
# datacenter PUE figures and per-token energy reports. They are
# DELIBERATELY rough — the goal is to give the loop a non-zero
# signal it can use for budget arithmetic and bid selection.
#
# Refresh by editing this file; the loader picks up changes via
# TariffTable::reload_from_path(). No redeploy needed.
#
# Schema:
#   [defaults]               # used when no [[entries]] match
#   joules_per_input_token  = <f64>
#   joules_per_output_token = <f64>
#
#   [[entries]]
#   provider = "<name>"
#   model    = "<name>"
#   joules_per_input_token  = <f64>
#   joules_per_output_token = <f64>

[defaults]
joules_per_input_token = 0.02
joules_per_output_token = 0.06

[[entries]]
provider = "anthropic"
model = "claude-opus-4-7"
joules_per_input_token = 0.05
joules_per_output_token = 0.15

