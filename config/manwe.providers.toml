# sigil: SCROLL
# Dynamic MANWE provider/model configuration.
# Reload live via: annunimas-cli manwe reload-config
#
# Provider taxonomy:
# - direct cloud provider: concrete upstream such as OpenAI, z.ai, Gemini, Groq
# - aggregator provider: multi-upstream surface such as OpenRouter
# - direct local/local-mesh surfaces: node-backed endpoints such as
#   edge_backbone (sovereign backbone), edge_core, edge_worker_light
#
# NOTE: do not set `healthy = true/false` on a provider — Manwe's runtime
# probe owns the live healthy flag. Setting it triggers a deprecation warning
# at config load and is otherwise ignored. Use `enabled = true/false` to
# control whether a provider participates in routing at all.

[[provider]]
id = "edge_beelink_light"
name = "Beelink Light Ternary Bonsai 8B Worker"
base_url = "http://100.103.125.88:9337/v1"
enabled = false
access_tier = "local"
quality_band = "medium"
requests_per_minute = 120

  [[provider.model]]
  id = "Ternary-Bonsai-8B-Q2_0"
  capable_tasks = ["code", "research", "reasoning", "chat", "summary", "background", "monitoring"]
  context_window = 131072
  is_default = true
  capabilities = { tools = true, structured_output = true, streaming = true }
  aliases = ["ternary-bonsai-8b", "bonsai-8b", "b8", "Ternary-Bonsai-8B-Q2_0"]
  notes = "Updated 2026-07-18. Beelink SER9 Pro :9337 now serves Ternary-Bonsai-8B-Q2_0 (ternary Q2_0 GGUF) via the Prism-ML llama.cpp fork built with GGML_VULKAN against the AMD Radeon 890M (Vulkan0). The stock ggerganov/llama.cpp rejects this ternary quant (tensor-layout mismatch), so only the Prism fork parses it. Replaces the prior Qwen_Qwen3.5-4B-Q6_K mainline lane."

