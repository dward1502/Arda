[[provider]]
id = "anthropic"
name = "Anthropic Claude (via hermes-agent subscription)"
# Subscription-backed path: manwe shells out to the local `hermes` CLI,
# which owns the CLAUDE_CODE_OAUTH_TOKEN / subscription auth. No API
# credits needed on the console.anthropic.com account.
driver = "hermes_agent_cli"
hermes_provider = "anthropic"
# hermes_bin defaults to $ANNUNIMAS_HERMES_BIN then `hermes` on PATH.
# hermes_toolsets defaults to "" (disable hermes's internal tool loop).
# DISABLED 2026-05 — no subscription funds / invalid key; router must not fail when provider is broke
enabled = false
access_tier = "paid_cloud"
quality_band = "high"
requests_per_minute = 60
requests_per_day = 10000
# Tools aren't surfaced through the CLI driver; Hermes-the-Annunimas-agent
# runs its own tool loop at the manwe caller level instead.
supports_tools = false
supports_structured_output = false

  [[provider.model]]
  id = "claude-sonnet-4-6"
  capable_tasks = ["code", "research", "reasoning", "chat", "summary", "background"]
  context_window = 200000
  is_default = true

  [[provider.model]]
  id = "claude-opus-4-6"
  capable_tasks = ["code", "research", "reasoning", "chat", "summary", "background"]
  context_window = 200000
  is_default = false

  [[provider.model]]
  id = "claude-haiku-4-5"
  capable_tasks = ["chat", "summary", "background"]
  context_window = 200000
  is_default = false

[[provider]]
id = "openai_sub"
name = "OpenAI Codex (ChatGPT subscription via Hermes auth)"
# Uses Hermes' openai-codex OAuth token store, but Manwe talks directly to
# the Codex Responses API to avoid spawning `hermes chat` per request.
driver = "codex_responses"
hermes_provider = "openai-codex"
base_url = "https://chatgpt.com/backend-api/codex"
enabled = false
access_tier = "paid_cloud"
quality_band = "high"
requests_per_minute = 60
requests_per_day = 10000
supports_tools = true
supports_structured_output = false

  [[provider.model]]
  id = "gpt-5.5"
  capable_tasks = ["code", "research", "reasoning", "chat", "summary", "background"]
  context_window = 1050000
  is_default = true

[[provider]]
id = "hermes_nous_proxy"
name = "Hermes Nous Portal Proxy"
# Persistent Hermes OAuth proxy. Enable when `hermes proxy providers` shows
# Nous ready; Manwe keeps `hermes proxy start --provider nous` warm and routes
# through this OpenAI-compatible local endpoint instead of shelling out per call.
driver = "hermes_proxy"
hermes_provider = "nous"
base_url = "http://127.0.0.1:8645/v1"
enabled = false
access_tier = "paid_cloud"
quality_band = "high"
requests_per_minute = 60
requests_per_day = 10000
supports_tools = true
supports_structured_output = true

  [[provider.model]]
  id = "auto"
  capable_tasks = ["code", "research", "reasoning", "chat", "summary", "background"]
  context_window = 128000
  is_default = true

