[[provider]]
id = "openrouter"
name = "OpenRouter"
# Single entry covering both the free :free-suffix lane and openrouter/auto.
# Previously split into openrouter_free + openrouter, which double-counted the
# upstream and produced a base_url-collision warning on every reload.
# Default is the aggregator auto route. Explicit :free models remain available
# for cheap non-tool spillover, but they must not silently win generic fallback
# after OpenRouter's free-models-per-day pool is exhausted.
base_url = "https://openrouter.ai/api/v1"
enabled = true
api_key_env = "OPENROUTER_API_KEY"
