[[provider]]
id = "edge_backbone_bonsai27"
name = "Annunimas Server Ternary Bonsai 27B Lane"
# Sovereign annunimas-server lane. Added 2026-07-18: Ternary-Bonsai-27B-Q2_0
# (ternary Q2_0 GGUF) served by the Prism-ML llama.cpp fork built with
# GGML_CUDA against the 2x RTX 2080 Super (8G each) on annunimas-server,
# tensor-split 0.05/0.95 across both GPUs (GPU0 is VRAM-tight behind the
# LFM25 + Gemma4 lanes). The stock ggerganov/llama.cpp cannot parse this
# ternary quant (tensor-layout mismatch), so only the Prism fork works.
base_url = "http://100.102.250.115:8095/v1"
enabled = true
access_tier = "local"
quality_band = "high"
requests_per_minute = 20
max_completion_tokens = 1024

  [[provider.model]]
  id = "ternary-bonsai-27b-q2_0"
  capable_tasks = ["research", "reasoning", "chat", "summary", "background"]
  context_window = 32768
  is_default = true
  capabilities = { tools = false, structured_output = false, streaming = true, visible_reasoning = false }
  aliases = ["ternary-bonsai-27b", "bonsai-27b", "b27", "Ternary-Bonsai-27B-Q2_0"]
  notes = "27B ternary Q2_0 (~6.7G). Served via llama-server-bonsai27.service (user systemd, enabled). As of 2026-07-21 this lane serves 32768 context on 2x RTX 2080 Super with --n-gpu-layers 600 --main-gpu 0 --split-mode row --tensor-split 0.20,0.80; the 999/all-layers path is blocked by Prism-fork allocator behavior on this host. Model emits a reasoning trace (thinking=1) before the final answer; visible_reasoning set false so the router treats it as a default-capable local model (the trace still arrives in reasoning_content for clients that read it)."

