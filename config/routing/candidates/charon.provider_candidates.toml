# DERIVED VIEW: this file is intake/reference only.
# Source of truth: config/manwe.providers.toml

# Manwe provider candidates are research/intake metadata only.
# This file is intentionally not consumed by live routing until Manwe grows an
# explicit candidate promotion path. Keep `config/manwe.providers.toml` as the
# source of truth for enabled providers.

schema_version = "arda.manwe.provider-candidates.v1"
generated_at_utc = "2026-06-05T00:00:00Z"
authority = "operator_research"

[policy]
allowed_statuses = ["candidate", "enabled", "rejected"]
allowed_free_kinds = ["permanent", "trial", "credits", "community", "unknown"]
promotion_requires_probe = true
promotion_requires_rate_cap = true
promotion_requires_payload_compatibility = true
promotion_target = "config/manwe.providers.toml"

[probe_budget]
# Capability discovery should prefer passive receipts from real traffic. Active
# probes are opt-in because many free/mixed providers expose 1000 calls/day or
# less, and probing every capability can consume useful operator quota.
active_capability_probes_enabled = false
positive_receipt_ttl_hours = 168
negative_receipt_ttl_hours = 24
max_active_probe_calls_per_provider_per_day = 5
max_active_probe_calls_per_model_per_day = 1
skip_active_probes_when_daily_remaining_ratio_below = 0.20
skip_active_probes_when_provider_requests_per_day_lte = 1000
passive_receipt_path = "data/manwe/provider_capability_receipts.json"
operator_surfaces = [
  "GET /providers/capabilities",
  "GET /provider_candidates",
  "GET /status capability_summary",
  "GET /health capability_summary"
]
next_integration_stage = "stream_capability_and_promotion_guard_data_to_arda_hud"

[[provider_candidate]]
id = "github_models"
name = "GitHub Models"
status = "candidate"
free_kind = "unknown"
requires_adapter = true
base_url = "https://models.github.ai/inference"
api_key_env = "GITHUB_TOKEN"
access_tier_candidate = "mixed"
priority = 1
notes = "Official REST inference with free limits and paid overage path. Endpoint is OpenAI-like but uses GitHub auth/scopes and may need a small adapter."
source_urls = ["https://docs.github.com/en/rest/models/inference"]
candidate_models = [
  "openai/gpt-4.1",
  "deepseek/DeepSeek-R1",
