# DERIVED VIEW: this file is intake/reference only.
# Source of truth: config/manwe.providers.toml

# sigil: SCROLL
[contract]
schema_version = "arda.model.route.v1"
authority = "sovereign_route_matrix"
default_inference_origin = "edge"

[weights]
local = 0.15
cloud = 0.45
edge = 0.85

[tiers.code]
primary_origin = "edge"
fallback_order = ["edge", "local", "cloud"]
privacy = "restricted"
cost = "balanced"

[tiers.research]
primary_origin = "edge"
fallback_order = ["edge", "local", "cloud"]
privacy = "restricted"
cost = "balanced"

[tiers.chat]
primary_origin = "edge"
fallback_order = ["edge", "local", "cloud"]
privacy = "restricted"
cost = "balanced"

[providers.edge]
enabled = true
allow_as_primary = true
# annunimas-server exposes two GPU-isolated routes: Nanbeige4.2 3B Q4 on
# edge_backbone_coder/:8098 for code and tool execution, and Bonsai 27B Q1 on
# edge_backbone_long/:8097 for orchestrator, review, research, and long context.
# Both models remain fully GPU-resident on one RTX 2080 Super each.
preferred = ["edge_backbone_coder", "edge_backbone_long", "edge_core", "edge_beelink_light", "edge_guardhouse"]

[providers.cloud]
enabled = true
allow_as_fallback_only = true
approved = ["cerebras", "groq", "google", "openrouter", "mistral", "nvidia"]
