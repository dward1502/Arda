# DERIVED VIEW: this file is intake/reference only.
# Source of truth: config/manwe.providers.toml

# sigil: SCROLL
[contract]
schema_version = "arda.model.route.v1"
authority = "sovereign_route_matrix"
default_inference_origin = "edge"

[weights]
local = 0.15
cloud = 0.45
edge = 0.85

[tiers.code]
primary_origin = "edge"
fallback_order = ["edge", "local", "cloud"]
privacy = "restricted"
cost = "balanced"

[tiers.research]
primary_origin = "edge"
fallback_order = ["edge", "local", "cloud"]
privacy = "restricted"
cost = "balanced"

[tiers.chat]
primary_origin = "edge"
fallback_order = ["edge", "local", "cloud"]
privacy = "restricted"
cost = "balanced"

[providers.edge]
enabled = true
allow_as_primary = true
# edge_backbone is the canonical annunimas-server route: 27B ternary,
# Prism/CUDA on :8095. edge_core stays the local tool-capable execution lane.
# NOTE: Bonsai-27B served ctx is capped at 8192; the router context floor was
# lowered to 8192 (ANNUNIMAS_MANWE_MIN_CONTEXT_WINDOW) so it clears. Tool/execution
# lanes keep the >=32K/64K guard to protect Hermes tool-call stability.
preferred = ["edge_backbone", "edge_core", "edge_beelink_light", "edge_guardhouse"]

[providers.cloud]
enabled = true
allow_as_fallback_only = true
approved = ["cerebras", "groq", "google", "openrouter", "mistral", "nvidia"]
