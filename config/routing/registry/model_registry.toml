[contract]
schema_version = "arda.model.registry.v1"
authority = "manwe_model_lifecycle"
status = "draft"
last_reviewed = "2026-07-27"
source_audit_json = "core/state/model_freshness_audit.json"
source_audit_markdown = "data/manwe/model_freshness_audit.md"

[policy]
default_selection = "auto_via_manwe"
download_requires_human_approval = true
service_switch_requires_human_approval = true
benchmark_required_before_promotion = true
removed_route_usage_receipts = "Keep usage/benchmark/audit receipts after route removal; do not keep dead route strings active in provider config."

[[lane]]
id = "council"
purpose = "Boardroom strategy, critique, and multi-agent deliberation."
selection = "auto_via_manwe"
preferred_provider_classes = ["edge", "subscription", "cloud"]
required_capabilities = ["reasoning", "long_context", "instruction_following"]
current_provider_ids = ["edge_backbone_long", "openai_sub", "openrouter"]
replacement_policy = "Prefer high-quality reasoning models with benchmark receipts; keep council seats logical, not fixed to model personas."
rollback_target = "openai_sub/gpt-5.5"

[[lane]]
id = "scout_research"
purpose = "ATHENA/Scout research, source summarization, and broad catalog discovery."
selection = "auto_via_manwe"
preferred_provider_classes = ["edge", "free_cloud", "mixed_cloud"]
required_capabilities = ["research", "summary", "long_context", "low_cost"]
current_provider_ids = ["edge_backbone_long", "edge_core", "openrouter", "nvidia"]
replacement_policy = "Prefer long-context low-cost models; cloud candidates remain routing candidates unless privacy policy permits source text egress."
rollback_target = "edge_core/Qwen_Qwen3.5-4B-Q6_K"

[[lane]]
id = "code_forge_mind"
purpose = "Code patch planning, tool-oriented reasoning, and repository work."
selection = "auto_via_manwe"
preferred_provider_classes = ["edge", "subscription", "cloud"]
required_capabilities = ["code", "reasoning", "tool_use", "repo_context"]
current_provider_ids = ["edge_backbone_coder", "openai_sub", "nvidia", "openrouter"]
replacement_policy = "Benchmark candidates on Annunimas code tasks before promotion."
rollback_target = "edge_core/LFM2.5-8B-A1B-Q4_K_M"

[[lane]]
id = "monitoring_warden"
purpose = "Fast local monitoring, health summaries, and guardhouse fallback."
selection = "prefer_small_local"
preferred_provider_classes = ["local", "edge"]
required_capabilities = ["chat", "summary", "monitoring", "low_latency"]
current_provider_ids = ["edge_guardhouse", "edge_worker_light", "local_fallback"]
replacement_policy = "Prefer small GGUF models that fit Pi5/edge worker memory envelopes; benchmark latency and failure mode robustness."
rollback_target = "edge_guardhouse/Qwen3.5-4B-Q4_K_M.gguf"

[[lane]]
id = "local_fallback"
purpose = "Offline/local fallback when primary Manwe routes are unavailable."
selection = "pinned_fallback"
preferred_provider_classes = ["local"]
required_capabilities = ["chat", "summary"]
current_provider_ids = ["local_fallback", "edge_core"]
replacement_policy = "Only replace after staged download, checksum, benchmark, and rollback receipt."
rollback_target = "local_fallback/Qwen3-8B-Q4_K_M"

