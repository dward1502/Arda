# sigil: SCROLL
[system]
name = "Annunimas"
log_level = "info"
max_concurrent_tasks = 4

[agents]
default_timeout_secs = 300
max_retries = 3

[paths]
data_dir = "data"
ledger_dir = "core/state/ledger"
knowledge_dir = "data/knowledge"
config_dir = "config"
registry_path = "registry.toml"

[joulework]
base_cost = 10
threshold = 100
game_theory_factor = 1.2

[llm]
default_provider = "opencode"

# Model routes: task_type -> model override
# Uncomment and customize to route different task types to different models
# [llm.model_routes]
# research = "llama3.1:8b"
# code = "qwen2.5-coder:3b"
# decision = "qwen2.5-coder:7b"
# ingest = "qwen2.5-coder:3b"

[llm.providers.opencode]
base_url = "https://opencode.ai/zen/v1"
api_key_env = "OPENCODE_API_KEY"
default_model = "opencode/deepseek-v4-flash-free"
