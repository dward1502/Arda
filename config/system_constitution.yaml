# sigil: SCROLL
version: 1
generated_on: '2026-02-25'

sovereign_authority:
  principal: arandur
  role: sovereign_commander
  has_full_override: true
  override_log_required: true

authority_chain:
  - arandur
  - ceo
  - warden
  - systems

systems:
  - name: ATHENA
    role: strategic_research_execution
    answers_to: arandur
  - name: WARDEN
    role: runtime_safety_governor
    answers_to: ceo
  - name: HADES
    role: security_archive_boundary
    answers_to: ceo

future_system_templates:
  - FINANCE
  - MARKETING
  - COMMUNICATIONS

major_alert_policy:
  requires_triad: true
  requires_ceo_confirmation: true
  requires_arandur_confirmation: true

validator_contract:
  schema_version: annunimas.validators.v2
  core:
    joulework:
      version: v1.2.0
      mode: always_on
      role: efficiency_and_cost_reality
    love_equation:
      version: v1.2.0
      mode: always_on
      role: alignment_and_human_resonance
    philosopher_triad:
      version: v2.0.0
      mode: consensus_2_of_3
      members:
        - aurelius@v1.0.0
        - bacon@v1.0.0
        - sun_tzu@v1.0.0
  light:
    - bacon_lite@v1.1.0
    - marcus_lite@v1.0.0
    - sun_tzu_lite@v1.0.0

human_augmentation:
  operating_model: zero_human_company_with_sovereign_escalation
  autonomous_classes:
    - bounded_research
    - local_refactors
    - safe_exports
    - routine_maintenance
  triad_quorum_classes:
    - strategy_change
    - provider_reroute
    - pricing_change
    - customer_commitment
    - data_retention_change
  human_required_classes:
    - funds_movement
    - legal_commitment
    - human_identity_or_access_change
    - destructive_delete
    - fleet_reimage

ceo_council:
  protocol_version: annunimas.ceo_council.v1
  ceo_identity: arandur
  cto_seat:
    mode: hybrid
    default_identity: warden
    infrastructure_fill_allowed: true
  ingress:
    primary: discord
    target_end_state: matrix
    messaging_is_not_source_of_truth: true
  loops:
    lightweight_default: true
    triad_required_for_medium_high_and_high: true
  memory_lanes:
    - id: human_sovereign
      retention: durable
      promotion_required: false
    - id: ceo_private_working
      retention: expiring
      promotion_required: true
      expiry_default: true
      cannot_authorize_irreversible_action: true
    - id: shared_executive
      retention: durable
      promotion_required: false
    - id: institutional
      retention: durable
      promotion_required: true
    - id: episodic
      retention: expiring
      promotion_required: false

task_lifecycle:
  contract_version: annunimas.task_lifecycle.v1
  canonical_pipeline:
    - plan
    - task_emission
    - task_retrieval
    - bounded_execution
    - completion_evidence
    - hades_disposal_review
    - archive_or_retention
  rules:
    completion_is_not_disposal: true
    disposal_is_not_deletion: true
    hades_controls_final_lifecycle_boundary: true
    disposal_marker_glyph: "↝"

selinux_safe_runtime:
  contract_version: annunimas.selinux_runtime_contract.v1
  host_family: bluefin_fedora_atomic
  enforcement_mode: selinux_enforcing_preferred
  service_owner: systemd
  canonical_authority_split:
    workstation: canonical_execution_authority
    beelink: bounded_edge_worker
    laptop: terminal_operator_optional_compute
  required_paths:
    runtime_dir: "${XDG_RUNTIME_DIR}/annunimas"
    state_dir: "${XDG_STATE_HOME:-$HOME/.local/state}/annunimas"
    cache_dir: "${XDG_CACHE_HOME:-$HOME/.cache}/annunimas"
  remote_control_plane:
    preferred: tailscale_http
    restricted_default_use: tailscale_ssh
  forbidden_patterns:
    - sockets_under_plain_tmp_for_core_runtime
    - laptop_as_required_backbone_inference_target
    - ad_hoc_backgrounding_as_canonical_service_model

build_verification_routing:
  contract_version: annunimas.build_verification_routing.v1
  authority_split:
    workstation: canonical_build_and_export_executor
    laptop: operator_terminal_not_default_build_executor
  required_remote_surface: scripts/remote/operator/remote_operator_workstation.sh
  remote_actions:
    - sync-check
    - cargo-check-cli
    - cargo-check-athena
    - cargo-check-prometheus
    - export-athena-plan
  rules:
    laptop_must_prefer_remote_for_cargo_check_test_run: true
    laptop_local_builds_only_for_tiny_emergency_edits: true
    agentic_execution_should_use_named_remote_actions_before_raw_ssh: true
