# Stopping/restarting Arda must NOT stop the independently owned keeper.
# Keeper loss stops Arda; recover the lost-capability state before starting Arda again.
[Unit]
Requires=arda-snapshot-keeper.service
After=arda-snapshot-keeper.service
BindsTo=arda-snapshot-keeper.service

[Service]
Environment=ARDA_SNAPSHOT_KEEPER_SOCKET=%t/arda-snapshot-keeper/keeper.sock
Environment=ARDA_HERMES_RETAINED_ADAPTER_CONFIG=%h/.config/arda/retained/hermes-adapter.toml
