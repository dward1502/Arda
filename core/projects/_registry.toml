# 𓀀 Arandur — All projects report to command
# ◇ Every choice point is recorded
# ============================================================
# A Project is a body of sovereign work with:
#   - Identity (what it is, why it exists)
#   - Agents (who is assigned, what they can do)
#   - Tasks (the queue of work)
#   - Budget (JouleWork allocation)
#   - Plan (the living document of intent)
#   - Decisions (immutable log of choices made)
#
# Status: active | paused | complete | archived
# Priority: 1 (highest) → 10 (lowest)
# ============================================================

