sigil       = "𓅃"
name        = "Communications"
description = "Inter-agent messaging, client interface, signal routing."
agents      = ["hermes"]
clearance   = "worker"
color       = "#ff88ff"

[[realms.definition]]
id          = "governance"
sigil       = "𓊝"
name        = "Governance"
description = "Triad gate, resonance scoring, phi harmonic validation."
agents      = ["oracle", "governance"]
