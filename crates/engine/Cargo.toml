[package]
name = "arda-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
# Core spine — the first set of Annunimas systems wired into Arda.
# Add more crates here as the engine's responsibilities grows.
annunimas-core = { path = "../spine/governance/annunimas-core" }
annunimas-charon = { path = "../spine/runtime/annunimas-charon" }
annunimas-service-registry = { path = "../spine/executors/annunimas-service-registry" }
annunimas-onboarding = { path = "../spine/interface/annunimas-onboarding" }

# Process supervision
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }

# Service registry (data-driven services.toml)
serde = { workspace = true }
toml = { workspace = true }

# Harness tap-in surface (axum HTTP — the single port Hermes connects to)
axum = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
tracing-subscriber = { workspace = true }
