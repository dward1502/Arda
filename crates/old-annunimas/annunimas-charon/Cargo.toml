[package]
name="annunimas-charon"
version="0.1"
edition="2021"

[lib]

[dependencies]
annunimas-charon = { path = "." }
annunimas-core = { path = "annunimas-core" }
annunimas-governance = { path = "annunimas-governance" }
annunimas-mnemosyne = { path = "annunimas-mnemosyne" }
annunimas-plutus = { path = "annunimas-plutus" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
thiserror = "1"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json","rustls-tls","stream"] }
base64 = "0.22"
rand = "0.8"
regex = "1"
axum = { version = "0.8", optional = true }
tower = { version = "0.5", optional = true, features = ["util"] }
tokio-stream = { version = "0.1", optional = true, features = ["time"] }
