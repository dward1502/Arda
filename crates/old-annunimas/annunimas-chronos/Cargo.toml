[package]
name = "annunimas-chronos"
version = "0.1.0"
edition = "2021"

[lib]
name = "annunimas_chronos"
path = "src/lib.rs"

[dependencies]
annunimas-core = { path = "../../governance/annunimas-core" }
annunimas-plutus = { path = "../../runtime/annunimas-plutus" }
annunimas-mnemosyne = { path = "../annunimas-mnemosyne" }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
uuid = { version = "1.0", features = ["v4"] }