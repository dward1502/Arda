# sigil: REPAIR
[package]
name = "annunimas-comm"
version = "0.1.0"
edition = "2021"
description = "Agent-to-Human communication module for Annunimas"

[dependencies]
annunimas-core = { path = "../annunimas-core" }
annunimas-governance = { path = "../annunimas-governance" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["full"] }
thiserror = "1"
async-trait = "0.1"

# For HTTP-based communication (A2H protocol)
reqwest = { version = "0.12", features = ["json"] }

# For message queue patterns
futures = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros"] }
