# sigil: REPAIR
[package]
name = "annunimas-plutus"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["http"]
http = ["dep:axum", "dep:tower", "dep:tokio-stream"]
economics = []

[dependencies]
annunimas-core = { path = "../../governance/annunimas-core" }
annunimas-governance = { path = "../../governance/annunimas-governance" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
thiserror.workspace = true
anyhow.workspace = true
chrono.workspace = true
toml.workspace = true
axum = { version = "0.7", optional = true }
tower = { version = "0.5", optional = true, features = ["util"] }
tokio-stream = { version = "0.1", optional = true, features = ["time"] }

[dev-dependencies]
tempfile = "3"
