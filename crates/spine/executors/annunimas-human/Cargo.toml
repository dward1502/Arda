[package]
name = "arda-human"
version = "0.1.0"
edition = "2021"

[lib]
name = "arda_human"
path = "src/lib.rs"

[dependencies]
arda-core = { path = "../arda-core" }
arda-mnemosyne = { path = "../arda-mnemosyne" }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = { workspace = true }
anyhow = "1.0"
walkdir = "2.3"
regex = "1.10"
tempfile = "3"
