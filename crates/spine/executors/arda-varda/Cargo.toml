
[package]
name = "arda-varda"
version = "0.1.0"
edition = "2021"

[features]
default = ["http"]
http = ["dep:axum", "dep:tower", "dep:tokio-stream"]

[dependencies]
arda-core = { path = "../../../../crates/spine/governance/arda-core" }
arda-governance = { path = "../../../../crates/spine/governance/arda-governance" }
arda-vaire = { path = "../../../../crates/spine/memory/arda-vaire" }
arda-economics = { path = "../../../../crates/spine/runtime/arda-economics" }
async-trait = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "blocking"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
sha2 = "0.10"
fs2 = "0.4"
axum = { version = "0.7", optional = true }
tower = { version = "0.5", optional = true, features = ["util"] }
tokio-stream = { version = "0.1", optional = true, features = ["time"] }

[dev-dependencies]
tempfile = "3"
