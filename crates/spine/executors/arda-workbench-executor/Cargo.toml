[package]
name = "arda-workbench-executor"
version = "0.1.0"
edition = "2021"
license.workspace = true

[features]
default = []
runtime = ["dep:arda-core", "dep:arda-orome", "dep:chrono", "dep:reqwest", "dep:sha2", "dep:tokio", "dep:uuid"]

[dependencies]
anyhow.workspace = true
arda-vaire.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
arda-core = { workspace = true, optional = true }
arda-orome = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
sha2 = { version = "0.10", optional = true }
tokio = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
