# sigil: REPAIR
[package]
name = "arda-core"
version = "0.2.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yaml-rust = "0.4"
serde_yaml = { workspace = true }
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
thiserror = "1"
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures = "0.3"
phf = { version = "0.11", features = ["macros"] }
anyhow = "1"
notify = "6.1"  # Filesystem watcher
arda-tool-harness = { path = "../../tooling/arda-tool-harness" }

[dev-dependencies]
tempfile = "3"
