# sigil: REPAIR
[package]
name = "arda-governance"
version = "0.1.0"
edition = "2021"

[features]
default = []

[dependencies]
arda-core = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
fs2 = "0.4"
rand = "0.8"
num-traits = "0.2"
rustfft = "6.2"
num-complex = "0.4"
tokio = { version = "1", features = ["full"] }
thiserror = "1"
toml = "0.8"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tempfile = "3"
