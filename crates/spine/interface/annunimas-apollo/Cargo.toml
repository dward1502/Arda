# sigil: REPAIR
[package]
name = "annunimas-apollo"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["http"]
http = ["dep:axum", "dep:tower", "dep:tokio-stream"]
rtk = []

[dependencies]
annunimas-core = { path = "../../governance/annunimas-core" }
annunimas-governance = { path = "../../governance/annunimas-governance" }
annunimas-plutus = { path = "../../runtime/annunimas-plutus" }
annunimas-warden = { path = "../../tooling/annunimas-warden" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
async-trait.workspace = true
tracing.workspace = true
anyhow.workspace = true
uuid.workspace = true
chrono.workspace = true
axum = { version = "0.7", optional = true }
tower = { version = "0.5", optional = true, features = ["util"] }
tokio-stream = { version = "0.1", optional = true, features = ["time"] }

[dev-dependencies]
tempfile = "3"
