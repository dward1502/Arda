# sigil: REPAIR
[package]
name = "annunimas-hermes"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
async-trait.workspace = true
tracing.workspace = true
anyhow.workspace = true
uuid.workspace = true
chrono.workspace = true
futures.workspace = true
reqwest = { version = "0.12", features = ["json"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "tokio1", "tokio1-native-tls"] }
imap = "3.0.0-alpha.15"
native-tls = "0.2"
annunimas-core.workspace = true
annunimas-governance.workspace = true
annunimas-oracle.workspace = true
annunimas-mnemosyne = { path = "../annunimas-mnemosyne" }
annunimas-plutus = { path = "../annunimas-plutus" }
annunimas-mcp = { path = "../annunimas-mcp" }
annunimas-athena = { path = "../annunimas-athena" }
annunimas-charon = { path = "../annunimas-charon" }
annunimas-hades = { path = "../annunimas-hades" }
annunimas-warden = { path = "../annunimas-warden" }
serenity.workspace = true
axum = { version = "0.7", optional = true }
tower = { version = "0.5", optional = true, features = ["util"] }
tokio-stream = { version = "0.1", optional = true, features = ["time"] }
fs2 = "0.4"
once_cell = "1.18.0"

[features]
default = ["http"]
http = ["dep:axum", "dep:tower", "dep:tokio-stream"]
a2a = []
email = []
slack = []

[dev-dependencies]
tempfile = "3"