# sigil: REPAIR
[package]
name = "arda-orome"
version = "0.1.0"
edition = "2021"
license.workspace = true

[features]
default = []
service-runtime = [
    "dep:arda-economics",
    "dep:arda-mandos",
    "dep:arda-vaire",
    "dep:once_cell",
    "dep:reqwest",
    "dep:tracing",
]

[dependencies]
arda-core = { workspace = true }
arda-governance = { workspace = true }
arda-vaire = { workspace = true, optional = true }
arda-mandos = { workspace = true, optional = true }
arda-economics = { workspace = true, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tracing = { version = "0.1", optional = true }
thiserror.workspace = true
fs2 = "0.4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
futures = "0.3"
once_cell = { version = "1", optional = true }
anyhow.workspace = true
prost = { version = "0.14", features = ["std"] }
tonic = { version = "0.14", default-features = false, features = ["codegen", "tls-webpki-roots", "transport"] }
tonic-prost = "0.14"
async-trait = { workspace = true }

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros"] }
tempfile = "3"
