# sigil: REPAIR
[package]
name = "arda-orome"
version = "0.1.0"
edition = "2021"

[features]
default = ["http"]
http = ["dep:axum", "dep:tower", "dep:tokio-stream"]

[dependencies]
arda-core = { path = "../../governance/arda-core" }
arda-governance = { path = "../../governance/arda-governance" }
arda-vaire = { path = "../../memory/arda-vaire" }
arda-mandos = { path = "../../runtime/arda-mandos" }
arda-plutus = { path = "../../runtime/arda-plutus" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
thiserror.workspace = true
fs2 = "0.4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
futures = "0.3"
once_cell = "1"
anyhow.workspace = true
axum = { version = "0.7", optional = true }
tower = { version = "0.5", optional = true, features = ["util"] }
tokio-stream = { version = "0.1", optional = true, features = ["time"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros"] }
tempfile = "3"
