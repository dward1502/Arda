syntax = "proto3";
package arda.orome.route_governance;

option java_package = "dev.arda.orome.routegovernance";
option java_multiple_files = true;

message RouteRequest {
  string model = 1;
  map<string, string> headers = 2;
  bytes body = 3;
}
message RouteResponse {
  int32 status = 1;
  bytes body = 2;
  string upstream = 3;
}

message GovernanceVerdictRequest {
  string policy_id = 1;
  string actor = 2;
  bytes payload = 3;
}
message GovernanceVerdictResponse {
  string verdict = 1;
  string policy_version = 2;
  string policy_hash = 3;
  string reason = 4;
}

service RouteGovernanceService {
  rpc RouteChatCompletions (RouteRequest) returns (RouteResponse);
  rpc GovernanceVerdict (GovernanceVerdictRequest) returns (GovernanceVerdictResponse);
}
