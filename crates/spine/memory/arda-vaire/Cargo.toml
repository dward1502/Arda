# sigil: REPAIR
[package]
name = "arda-vaire"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["http"]
http = ["dep:axum", "dep:tower", "dep:tokio-stream"]
obsidian-import = []

[dependencies]
arda-core = { workspace = true }
arda-governance = { workspace = true }
arda-economics = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", optional = true }
tower = { version = "0.5", optional = true, features = ["util"] }
tokio-stream = { version = "0.1", optional = true, features = ["time"] }
tracing = "0.1"
thiserror.workspace = true
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"

[[bench]]
name = "recall_fidelity"
harness = false