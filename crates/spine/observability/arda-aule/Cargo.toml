[package]
name = "arda-aule"
version = "0.1.0"
edition = "2021"

[features]
default = []
full-cli = [
  "arda-core",
  "arda-vaire",
  "arda-economics",
  "arda-orome",
  "arda-mandos",
  "arda-varda",
  "telemetry",
]
telemetry = [
  "opentelemetry",
  "opentelemetry-otlp",
  "tracing-opentelemetry",
  "opentelemetry_sdk",
  "tonic",
]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }
notify = "6.1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures = "0.3"
sha2 = "0.10"
regex = "1"
rand = "0.8"
phf = { version = "0.11", features = ["macros"] }
async-trait = "0.1"
once_cell = "1"
prometheus = "0.13"
dotenv = "0.15"
fs2 = "0.4"
tempfile = { version = "3", optional = true }
axum = { version = "0.7", optional = true }
tower = { version = "0.5", optional = true, features = ["util"] }
tokio-stream = { version = "0.1", optional = true, features = ["time"] }

arda-core = { path = "../../governance/arda-core", optional = true }
arda-governance = { path = "../../governance/arda-governance" }
arda-economics = { path = "../../runtime/arda-economics", optional = true }
arda-vaire = { path = "../../memory/arda-vaire", optional = true }
arda-mandos = { path = "../../runtime/arda-mandos", optional = true }
arda-varda = { path = "../../executors/arda-varda", optional = true }
arda-orome = { path = "../../interface/arda-orome", optional = true }

opentelemetry = { version = "0.32", default-features = false, features = ["trace", "logs"], optional = true }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["tonic", "tls-roots"], optional = true }
tracing-opentelemetry = { version = "0.33", optional = true }
opentelemetry_sdk = { version = "0.32", features = ["tokio", "rt-tokio"], optional = true }
tonic = { version = "0.14", features = ["tls-webpki-roots", "transport"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros"] }
tempfile = "3"
tracing-subscriber = "0.3"

[[bin]]
name = "arda-cli"
path = "src/cli/main.rs"
