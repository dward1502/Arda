# sigil: REPAIR
[package]
name = "arda-prometheus"
version = "0.1.0"
edition = "2021"

[features]
default = ["http"]
http = ["dep:axum", "dep:tower", "dep:tokio-stream"]

[dependencies]
arda-core.workspace = true
arda-council = { path = "../arda-council" }
arda-governance = { path = "../arda-governance" }
arda-hermes = { path = "../arda-hermes" }
arda-mnemosyne = { path = "../arda-mnemosyne" }
arda-fleet = { path = "../arda-fleet" }
arda-apollo = { path = "../arda-apollo", default-features = false }
arda-oracle = { path = "../arda-oracle", default-features = false }
arda-comm = { path = "../arda-comm" }
arda-systemd = { path = "../arda-systemd" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tokio = { version = "1", features = ["full"] }
sha2 = "0.10"
async-trait.workspace = true
axum = { version = "0.7", optional = true }
tower = { version = "0.5", optional = true, features = ["util"] }
tokio-stream = { version = "0.1", optional = true, features = ["time"] }

[dev-dependencies]
arda-charon = { path = "../arda-charon" }
anyhow = "1"
tempfile = "3"
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "prometheus"
harness = false

[[bin]]
name = "ceo-autopilot"
path = "src/bin/ceo_autopilot.rs"
