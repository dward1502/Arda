# sigil: REPAIR
[package]
name = "annunimas-hades"
version = "0.1.0"
edition = "2021"

[features]
default = ["http"]
http = ["dep:axum", "dep:tower", "dep:tokio-stream"]

[dependencies]
annunimas-core = { path = "../../governance/annunimas-core" }
annunimas-governance = { path = "../../governance/annunimas-governance" }
annunimas-mnemosyne = { path = "../../memory/annunimas-mnemosyne" }
annunimas-plutus = { path = "../annunimas-plutus" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
thiserror.workspace = true
walkdir = "2"
fs2 = "0.4"
axum = { version = "0.7", optional = true }
tower = { version = "0.5", optional = true, features = ["util"] }
tokio-stream = { version = "0.1", optional = true, features = ["time"] }
async-trait = "0.1"
regex = "1"
once_cell = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "hades_benchmarks"
harness = false
