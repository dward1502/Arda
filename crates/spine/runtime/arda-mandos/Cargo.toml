# sigil: REPAIR
[package]
name = "arda-mandos"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["http"]
http = ["dep:axum", "dep:tower", "dep:tokio-stream"]

[dependencies]
arda-economics = { workspace = true }
arda-core = { workspace = true }
arda-governance = { workspace = true }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
async-trait.workspace = true
tracing.workspace = true
anyhow.workspace = true
uuid = { workspace = true, features = ["v5"] }
unicode-normalization = "0.1"
unicode_categories = "0.1"
sha2 = "0.10"
chrono.workspace = true
axum = { version = "0.7", optional = true }
tower = { version = "0.5", optional = true, features = ["util"] }
tokio-stream = { version = "0.1", optional = true, features = ["time"] }

[dev-dependencies]
tempfile = "3"