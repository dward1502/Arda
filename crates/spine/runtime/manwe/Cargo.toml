# sigil: REPAIR
[package]
name = "manwe"
version = "0.1.0"
edition = "2021"
license.workspace = true
authors.workspace = true

[lib]
name = "manwe"
path = "src/lib.rs"

[[bin]]
name = "manwe"
path = "src/main.rs"

[features]
default = ["adaptive"]
adaptive = ["dep:arda-core", "dep:arda-governance", "dep:arda-economics", "dep:arda-vaire"]
telemetry = ["arda-aule/telemetry"]

[dependencies]
regex = "1"
tokio = { workspace = true }
axum = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
fs2 = { workspace = true }
futures = { workspace = true }
tokio-stream = "0.1"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
arda-core = { workspace = true, optional = true }
arda-governance = { workspace = true, optional = true }
arda-economics = { workspace = true, optional = true }
arda-vaire = { workspace = true, optional = true }
arda-aule = { workspace = true, optional = true }

[dependencies.rand]
version = "0.8"

[dev-dependencies]
tempfile = "3"
