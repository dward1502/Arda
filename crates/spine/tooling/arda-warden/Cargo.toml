# sigil: REPAIR
[package]
name = "arda-warden"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "informant"                # New: sidecar binary
path = "src/informant/main.rs"

[dependencies]
arda-core.workspace = true
arda-governance = { path = "../arda-governance" }
arda-oracle = { path = "../arda-oracle" }
arda-plutus = { path = "../arda-plutus" }
podman-api = "0.11"                # Podman API client
tokio = { version = "1", features = ["full", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
sysinfo = "0.30"
sodiumoxide = "0.2.7"               # New: Libsodium bindings for encryption
base64 = "0.22"                   # For encoding encrypted blobs in files
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "runaway_loop_detector"
path = "src/runaway_loop_detector/main.rs"

[[bin]]
name = "schema_drift_detector"
path = "src/schema_drift_detector/main.rs"
