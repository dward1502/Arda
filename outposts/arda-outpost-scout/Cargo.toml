[package]
name = "arda-outpost-scout"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["dward"]

[dependencies]
arda-outpost-protocol = { path = "../arda-outpost-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
uuid = { version = "1", features = ["v4", "serde"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
