# Arda supervised service registry.
# To add/remove services, edit this file — not src/main.rs.

[[service]]
name = "arda-launcher"
path = "apps/arda-launcher/src-tauri"
required = true
optional = false
tags = ["ui"]

  [service.start]
  command = "cargo"
  args = ["tauri", "dev"]
  cwd = "apps/arda-launcher"

  [service.health]
  url = "http://127.0.0.1:1420"
  interval_secs = 5
  timeout_secs = 2

[[service]]
name = "arda-hud"
path = "apps/arda-hud"
required = false
optional = true
tags = ["ui"]

  [service.start]
  command = "pnpm"
  args = ["dev"]
  cwd = "apps/arda-hud"

  [service.health]
  url = "http://127.0.0.1:5173"
  interval_secs = 5
  timeout_secs = 2

[[service]]
name = "manwe"
path = "crates/spine/runtime/manwe"
required = true
optional = false
tags = ["gateway"]

  [service.start]
  command = "target/release/manwe"
  args = ["--config", "manwe.toml", "--bind", "127.0.0.1", "--port", "7171"]
  cwd = "."

  [service.health]
  url = "http://127.0.0.1:7171/healthz"
  interval_secs = 5
  timeout_secs = 2
