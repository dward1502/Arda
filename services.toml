# Arda daemon service registry — data-driven (no recompile to add/remove apps).
#
# Each entry describes a supervised child process. The daemon searches `dirs`
# (relative to the repo root) cross-joined with `names`; the first existing
# path is used as the executable.
#
#   required = true  -> daemon aborts if the exe is missing.
#   required = false -> service is skipped with a warning if missing.
#   no_ui    = true  -> excluded when the daemon is launched with `--no-ui`.

[[services]]
name = "arda-launcher"
dirs = [
  "apps/arda-launcher/src-tauri/target/debug",
  "apps/arda-launcher/src-tauri/target/release",
]
names = ["arda-launcher", "arda_launcher"]
required = false
no_ui = true

[[services]]
name = "arda-hud"
dirs = [
  "apps/arda-hud/src-tauri/target/debug",
  "apps/arda-hud/src-tauri/target/release",
]
names = ["arda-hud", "arda_hud"]
required = false
no_ui = true

# Gateway (`manwe`). Port 7171 is reserved workspace-wide per the
# frozen refactor contract — nothing else may claim it.
[[services]]
name = "manwe"
dirs = [
  "target/debug",
  "target/release",
]
names = ["manwe"]
args = ["--port", "7171"]
required = false
no_ui = false
